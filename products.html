<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Equipment Range — Hashoer Intelligent Technology</title>
  <link rel="canonical" href="https://hashoer.com/products.html">
  <meta name="description" content="Browse the complete Hashoer equipment range — 21 pharmaceutical filling, washing, sterilizing and capping lines. Search by name, container or model.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1a56db;
      --primary-dark: #1648b8;
      --secondary: #f97316;
      --dark: #1f2937;
      --gray: #6b7280;
      --light: #f3f4f6;
      --white: #ffffff;
      --border: #e5e7eb;
    }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: var(--dark);
      line-height: 1.6;
      background: #fff;
    }

    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }

    /* ── NAV（与主页同款） ── */
    .nav {
      background: var(--white);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 68px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.3rem;
      font-weight: 700;
      color: #c8161d;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .logo-icon img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .nav-right { display: flex; align-items: center; gap: 28px; }
    .nav-links { display: flex; gap: 28px; align-items: center; }
    .nav-links a { font-size: 0.95rem; color: var(--gray); transition: color 0.2s; }
    .nav-links a:hover { color: var(--primary); }
    .nav-links a.active { color: var(--primary); font-weight: 600; }
    .nav-cta {
      background: var(--primary);
      color: #fff !important;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .nav-cta:hover { background: var(--primary-dark); }
    .lang-select { display: none; }
    .lang-dd { position: relative; display: inline-block; }
    .lang-btn {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 12px; border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--white); color: var(--dark);
      cursor: pointer; font-family: inherit; font-size: 0.9rem;
      max-width: 170px;
    }
    .lang-flag { width: 22px; height: 15px; object-fit: cover; border-radius: 2px; flex: 0 0 auto; box-shadow: 0 0 0 1px rgba(0,0,0,0.08); }
    .lang-code { font-weight: 700; font-size: 0.82em; letter-spacing: 0.5px; }
    .lang-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lang-caret { font-size: 0.7em; opacity: 0.55; }
    .lang-menu {
      display: none; position: absolute; top: calc(100% + 6px); right: 0;
      background: var(--white); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 10px 28px rgba(15,23,42,0.14);
      min-width: 200px; max-height: min(360px, 70vh); overflow-y: auto;
      z-index: 1200; padding: 4px;
    }
    .lang-menu.open { display: block; }
    .lang-row {
      display: flex; align-items: center; gap: 9px; width: 100%;
      padding: 9px 12px; border: 0; border-radius: 7px;
      background: none; cursor: pointer; font-family: inherit;
      font-size: 0.95rem; color: var(--dark); text-align: start;
    }
    .lang-row:hover { background: #f1f5f9; }
    .lang-row.active { background: #eef2ff; }
    .lang-row.active .lang-name { font-weight: 700; }

    .page-foot {
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--gray);
      font-size: 0.85rem;
      padding: 28px 24px 36px;
    }

    @media (max-width: 900px) {
      .nav-links { gap: 16px; }
      .nav-links a:not(.nav-cta) { display: none; }
    }
  </style>
  <!-- ═══ Google 追踪（GA4 + Google Ads 转化）═══
       现在留空 = 不加载任何谷歌脚本，零成本、零影响、无报错。
       拿到 ID 后把下面三行填上，全站追踪立即生效（其余不用改）。
       也可以用「换 ID」脚本一键替换。 -->
  <script>
    window.HASHOER_GA4_ID   = 'G-WEW3FCP019';   /* GA4 衡量 ID，例：G-ABC123XYZ4 */
    window.HASHOER_AW_ID    = '';   /* Google Ads 转化 ID，例：AW-123456789 */
    window.HASHOER_AW_LABEL = '';   /* 转化标签，例：AbC-D_efGhIjk */
  </script>
  <script>
    (function () {
      window.hashoerTrack = window.hashoerTrack || function () {};
      var GA = window.HASHOER_GA4_ID, AW = window.HASHOER_AW_ID;
      if (!GA && !AW) return;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(GA || AW);
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      if (GA) window.gtag('config', GA, { anonymize_ip: true });
      if (AW) window.gtag('config', AW);
      window.hashoerTrack = function (name, label, params) {
        try {
          if (GA) {
            if (params) window.gtag('event', name, params);
            else window.gtag('event', name);
          }
          var lb = label || window.HASHOER_AW_LABEL;
          if (AW && lb) window.gtag('event', 'conversion', { send_to: AW + '/' + lb });
        } catch (e) {}
      };
      /* 虚拟页面浏览：让「网址不变」的浏览（产品详情弹窗等）也能出现在 GA4「页面和屏幕」报表里 */
      window.hashoerTrackPage = function (path, title) {
        try {
          if (!GA) return;
          window.gtag('event', 'page_view', {
            page_path: path,
            page_title: title,
            page_location: window.location.origin + path
          });
        } catch (e) {}
      };
    })();
  </script>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon"><img src="images/logo.jpg" alt="Hashoer Logo" onerror="this.remove()"></div>
        Hashoer
      </a>
      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="index.html" data-i18n="nav_home">Home</a></li>
          <li><a href="index.html#products" data-i18n="nav_products">Products</a></li>
          <li><a href="index.html#videos" data-i18n="nav_videos">Videos</a></li>
          <li><a href="index.html#about" data-i18n="nav_about">About</a></li>

          <li><a href="index.html#contact" class="nav-cta" data-i18n="nav_quote">Get a Quote</a></li>
        </ul>
        <div class="lang-dd">
          <button type="button" class="lang-btn" id="langBtn" aria-label="Language" aria-haspopup="listbox"></button>
          <div class="lang-menu" id="langMenu" role="listbox"></div>
          <select id="langSelect" class="lang-select" aria-hidden="true" tabindex="-1"></select>
        </div>
      </div>
    </div>
  </nav>

  <!-- ════ FULL PRODUCT CATALOGUE (rendered by products.js) ════ -->
  <div id="catalogRoot"></div>

  <div class="page-foot">© 2023 Hashoer Intelligent Technology (Shanghai) Ltd. All rights reserved.</div>

  <script>
    /* ════ 导航多语（16 语，与主页字典同步） ════ */
    const NAVI18N = {
      zh:  { nav_home:"首页", nav_products:"产品", nav_videos:"视频", nav_about:"关于我们", nav_contact:"联系我们", nav_quote:"获取报价" },
      en:  { nav_home:"Home", nav_products:"Products", nav_videos:"Videos", nav_about:"About", nav_contact:"Contact", nav_quote:"Get a Quote" },
      ja:  { nav_home:"ホーム", nav_products:"製品", nav_videos:"ビデオ", nav_about:"会社概要", nav_contact:"お問い合わせ", nav_quote:"見積もりを依頼" },
      ko:  { nav_home:"홈", nav_products:"제품", nav_videos:"동영상", nav_about:"회사 소개", nav_contact:"문의하기", nav_quote:"견적 요청" },
      ru:  { nav_home:"Главная", nav_products:"Продукция", nav_videos:"Видео", nav_about:"О компании", nav_contact:"Контакты", nav_quote:"Запросить КП" },
      fr:  { nav_home:"Accueil", nav_products:"Produits", nav_videos:"Vidéos", nav_about:"À propos", nav_contact:"Contact", nav_quote:"Demander un devis" },
      es:  { nav_home:"Inicio", nav_products:"Productos", nav_videos:"Vídeos", nav_about:"Nosotros", nav_contact:"Contacto", nav_quote:"Solicitar cotización" },
      pt:  { nav_home:"Início", nav_products:"Produtos", nav_videos:"Vídeos", nav_about:"Sobre", nav_contact:"Contato", nav_quote:"Solicitar orçamento" },
      th:  { nav_home:"หน้าแรก", nav_products:"ผลิตภัณฑ์", nav_videos:"วิดีโอ", nav_about:"เกี่ยวกับเรา", nav_contact:"ติดต่อเรา", nav_quote:"ขอใบเสนอราคา" },
      vi:  { nav_home:"Trang chủ", nav_products:"Sản phẩm", nav_videos:"Video", nav_about:"Giới thiệu", nav_contact:"Liên hệ", nav_quote:"Yêu cầu báo giá" },
      bn:  { nav_home:"হোম", nav_products:"পণ্য", nav_videos:"ভিডিও", nav_about:"আমাদের সম্পর্কে", nav_contact:"যোগাযোগ", nav_quote:"উদ্ধৃতি চান" },
      ur:  { nav_home:"ہوم", nav_products:"پروڈکٹس", nav_videos:"ویڈیوز", nav_about:"ہمارے بارے میں", nav_contact:"رابطہ کریں", nav_quote:"کوٹیشن مانگیں" },
      fa:  { nav_home:"خانه", nav_products:"محصولات", nav_videos:"ویدیوها", nav_about:"درباره ما", nav_contact:"تماس", nav_quote:"درخواست قیمت" },
      ar:  { nav_home:"الرئيسية", nav_products:"المنتجات", nav_videos:"الفيديوهات", nav_about:"من نحن", nav_contact:"اتصل بنا", nav_quote:"اطلب عرض سعر" },
      de:  { nav_home:"Start", nav_products:"Produkte", nav_videos:"Videos", nav_about:"Über uns", nav_contact:"Kontakt", nav_quote:"Angebot anfordern" },
      it:  { nav_home:"Home", nav_products:"Prodotti", nav_videos:"Video", nav_about:"Chi siamo", nav_contact:"Contatti", nav_quote:"Richiedi un preventivo" }
    };

    const P_LANGS = [
      {code:'zh', name:'中文', flag:'🇨🇳'},
      {code:'ja', name:'日本語', flag:'🇯🇵'},
      {code:'ko', name:'한국어', flag:'🇰🇷'},
      {code:'ru', name:'Русский', flag:'🇷🇺'},
      {code:'en', name:'English', flag:'🇬🇧'},
      {code:'fr', name:'Français', flag:'🇫🇷'},
      {code:'es', name:'Español', flag:'🇪🇸'},
      {code:'pt', name:'Português', flag:'🇵🇹'},
      {code:'th', name:'ไทย', flag:'🇹🇭'},
      {code:'vi', name:'Tiếng Việt', flag:'🇻🇳'},
      {code:'bn', name:'বাংলা', flag:'🇧🇩'},
      {code:'ur', name:'اردو', flag:'🇵🇰'},
      {code:'fa', name:'فارسی', flag:'🇮🇷'},
      {code:'ar', name:'العربية', flag:'🇸🇦'},
      {code:'de', name:'Deutsch', flag:'🇩🇪'},
      {code:'it', name:'Italiano', flag:'🇮🇹'}
    ];

    const P_COUNTRY_TO_LANG = {
      CN:'zh', HK:'zh', MO:'zh', TW:'zh',
      JP:'ja', KR:'ko',
      RU:'ru', BY:'ru', KZ:'ru', KG:'ru', TJ:'ru', UZ:'ru', TM:'ru',
      FR:'fr', MC:'fr', LU:'fr', CD:'fr', CI:'fr', SN:'fr', CM:'fr', MA:'fr', DZ:'fr', TN:'fr',
      ES:'es', MX:'es', AR:'es', CO:'es', CL:'es', PE:'es', VE:'es', EC:'es', GT:'es', CU:'es',
      BO:'es', DO:'es', HN:'es', PY:'es', SV:'es', NI:'es', CR:'es', PA:'es', UY:'es', GQ:'es',
      BR:'pt', PT:'pt', AO:'pt', MZ:'pt',
      TH:'th', VN:'vi', BD:'bn', PK:'ur', IR:'fa',
      SA:'ar', AE:'ar', EG:'ar', JO:'ar', KW:'ar', QA:'ar', BH:'ar', OM:'ar', IQ:'ar', LB:'ar', SY:'ar', YE:'ar', MA:'ar', DZ:'ar', TN:'ar', LY:'ar',
      DE:'de', AT:'de', CH:'de', LI:'de', LU:'de',
      IT:'it', SM:'it', VA:'it'
    };

    function pApplyLang(lang) {
      const dict = NAVI18N[lang] || NAVI18N.en;
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        const key = el.getAttribute('data-i18n');
        if (dict[key] !== undefined) el.textContent = dict[key];
      });
      const sel = document.getElementById('langSelect');
      if (sel) sel.value = lang;
      updateLangBtn(lang);
    }
    /* 挂到 window：products.js 加载后会包装它，实现目录随语言重绘 */
    window.applyLang = pApplyLang;

    function pOnLangChange(code) {
      if (typeof window.applyLang === 'function') window.applyLang(code); else pApplyLang(code);
      try {
        localStorage.setItem('hashoer_lang', code);
        localStorage.setItem('hashoer_lang_manual', '1');
        sessionStorage.setItem('hashoer_active_lang', code);
      } catch (e) {}
    }

    function pBuildLangSelect() {
      const sel = document.getElementById('langSelect');
      P_LANGS.forEach(function (l) {
        const opt = document.createElement('option');
        opt.value = l.code;
        opt.textContent = l.flag + ' ' + l.name;
        sel.appendChild(opt);
      });
    }

    /* 国旗下拉（Windows 无国旗 emoji，用 flagcdn 图片替代） */
    const LANG_CC = { zh:'cn', ja:'jp', ko:'kr', ru:'ru', en:'gb', fr:'fr', es:'es', pt:'pt', th:'th', vi:'vn', bn:'bd', ur:'pk', fa:'ir', ar:'sa', de:'de', it:'it' };
    function flagImgHTML(code, cls) {
      return '<img class="' + cls + '" src="https://flagcdn.com/w40/' + (LANG_CC[code] || 'gb') + '.png" alt="" onerror="this.style.visibility=\'hidden\'">';
    }
    function closeLangMenu() {
      const m = document.getElementById('langMenu');
      if (m) m.classList.remove('open');
    }
    function buildLangMenu() {
      const menu = document.getElementById('langMenu');
      const btn = document.getElementById('langBtn');
      if (!menu || !btn) return;
      menu.innerHTML = P_LANGS.map(function(l){
        return '<button type="button" class="lang-row" data-code="' + l.code + '">' + flagImgHTML(l.code, 'lang-flag') +
          '<span class="lang-code">' + l.code.toUpperCase() + '</span>' +
          '<span class="lang-name">' + l.name + '</span></button>';
      }).join('');
      menu.addEventListener('click', function(ev){
        const row = ev.target.closest('.lang-row');
        if (!row) return;
        closeLangMenu();
        pOnLangChange(row.getAttribute('data-code'));
      });
      btn.addEventListener('click', function(ev){
        ev.stopPropagation();
        menu.classList.toggle('open');
      });
      document.addEventListener('click', function(ev){
        if (!ev.target.closest('.lang-dd')) closeLangMenu();
      });
    }
    function updateLangBtn(lang) {
      const btn = document.getElementById('langBtn');
      if (!btn) return;
      const l = P_LANGS.filter(function(x){ return x.code === lang; })[0] || P_LANGS[4];
      btn.innerHTML = flagImgHTML(l.code, 'lang-flag') +
        '<span class="lang-code">' + l.code.toUpperCase() + '</span>' +
        '<span class="lang-name">' + l.name + '</span><span class="lang-caret">▾</span>';
      document.querySelectorAll('.lang-row').forEach(function(r){
        r.classList.toggle('active', r.getAttribute('data-code') === lang);
      });
    }

    function pInitialLang() {
      try {
        if (localStorage.getItem('hashoer_lang_manual') === '1') {
          const saved = localStorage.getItem('hashoer_lang');
          if (saved && NAVI18N[saved]) return saved;
        }
        const sess = sessionStorage.getItem('hashoer_active_lang');
        if (sess && NAVI18N[sess]) return sess;
      } catch (e) {}
      return 'en';
    }

    function pAutoDetect() {
      let manual = false;
      try { manual = localStorage.getItem('hashoer_lang_manual') === '1'; } catch (e) {}
      if (manual) return;
      fetch('https://ipwho.is/', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          const cc = d && d.country_code ? String(d.country_code).toUpperCase() : '';
          const lang = P_COUNTRY_TO_LANG[cc];
          if (typeof window.applyLang === 'function') window.applyLang(lang || 'en'); else pApplyLang(lang || 'en');
        })
        .catch(function () {});
    }

    pBuildLangSelect();
    buildLangMenu();
    pApplyLang(pInitialLang());
    pAutoDetect();
  </script>

  <script src="products.js?v=20260921a" charset="utf-8"></script>
</body>
</html>
